Environment:
  task: "HarvestMilk"
  task_parameter:
    image_size: [160,256]
    step_penalty: 0
    nav_reward_scale: 0.1
    success_reward: 10
    # max_spawn_range: 10
    # max_episode_len: 500
  num_envs: 1
  seed: 123
 
  action_space: "ReducedActionSpace"
  observation: "ImageObservation"

PPO_Training:
  save_name: "1M_CLIP_HarvestMilk"
  policy_network:
    features_extractor_type: "CLIP" 
    mine_clip_path: "./mineclip_model"
    gamma: 0.985
    gea_lambda: 0.95
    entropy_coef: 3E-4
  training_step: 1000000 #1M
  eval_episode: 20