Environment:
  task: "HarvestWool"
  task_parameter:
    image_size: [224,224]
    step_penalty: 0.01
    nav_reward_scale: 0.1
    success_reward: 10
    max_episode_len: 500
    # max_spawn_range: 10
    # target_quantities: 1

  num_envs: 2
  seed: 123
 
  action_space: "ReducedActionSpace"
  observation: "ImageObservation"

PPO_Training:
  save_name: "1M_CLIP_HarvestWool"
  policy_network:
    features_extractor_type: "CNN" 
    gamma: 0.985
    gea_lambda: 0.95
    entropy_coef: 3E-4
  training_step: 1000000 #1M
  eval_episode: 10 