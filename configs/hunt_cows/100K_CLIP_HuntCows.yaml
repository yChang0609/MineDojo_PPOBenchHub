Environment:
  task: "HuntCows"
  task_parameter:
    image_size: [160,256]
    step_penalty: 0
    nav_reward_scale: 0.5
    attack_reward: 1
    success_reward: 10
    mob_quantities: 4
    target_quantities: 1
    max_episode_len: 128
    # max_spawn_range: 10
  num_envs: 2
  seed: 123
 
  action_space: "ReducedActionSpace"
  observation: "ImageObservation"

PPO_Training:
  save_name: "100K_CLIP_HuntCows"
  policy_network:
    features_extractor_type: "CLIP" 
    mine_clip_path: "./mineclip_model"
    gamma: 0.985
    gea_lambda: 0.95
    entropy_coef: 3E-4
  training_step: 100000 #100K
  eval_episode: 20