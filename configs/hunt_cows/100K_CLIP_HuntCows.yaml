Environment:
  task: HuntCows
  task_parameter:
    image_size:
    - 160
    - 256
    step_penalty: 0
    nav_reward_scale: 1
    attack_reward: 1
    success_reward: 10
    target_quantities: 1
    max_episode_len: 250
    mob_quantities: 3
    max_spawn_range: 5
  num_envs: 2
  seed: 123
  action_space: ReducedActionSpace
  observation: ImageObservation
  frame_stack: 4
PPO_Training:
  save_name: 100K_CLIP_HuntCows
  total_timesteps: 100000
  eval_episodes: 20
  algo:
    gamma: 0.985
    gae_lambda: 0.95
    ent_coef: 3E-4
  policy:
    class_path: utils.policies.DreamerActorCritic
    ortho_init: false
    net_kwargs:
      hid_dim: 1024
      num_layers: 3
      activation: silu
      norm: rmsnorm
      share_backbone: false
    features_extractor:
      class_path: utils.extractors.CLIPFeatureExtractor
      kwargs:
        features_dim: 1024
        clip_model_path: ./mineclip_model
        project_activation: relu
